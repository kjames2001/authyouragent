# Publish the npm packages with trusted publishing (no token stored).
# Trigger: push a tag like `js-v0.3.0`. The tag must match both package.json versions.
# Each package must already exist on npm with this workflow set as its trusted publisher.
# Manual run (Actions tab, "Run workflow"): `npm publish --dry-run` only, never publishes;
# pick a runner image to try a new one before `ubuntu-latest` moves to it.
name: Publish npm packages

on:
  push:
    tags: ["js-v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image for the dry run"
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, ubuntu-24.04, ubuntu-26.04]

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Pack the SDK
        working-directory: sdk-js
        run: npm publish --access public --dry-run
      - name: Pack the MCP wrapper
        working-directory: sdk-js/npm-wrapper
        run: npm publish --access public --dry-run

  publish:
    if: startsWith(github.ref, 'refs/tags/js-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write     # trusted publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Check the tag matches both versions
        run: |
          for p in sdk-js/package.json sdk-js/npm-wrapper/package.json; do
            v=$(node -p "require('./$p').version")
            [ "js-v$v" = "$GITHUB_REF_NAME" ] || { echo "$p: tag $GITHUB_REF_NAME != version $v"; exit 1; }
          done
      - name: Publish the SDK
        working-directory: sdk-js
        run: npm publish --access public
      - name: Publish the MCP wrapper
        working-directory: sdk-js/npm-wrapper
        run: npm publish --access public
