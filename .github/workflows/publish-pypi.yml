# Publish the Python SDK to PyPI with trusted publishing (no token stored).
# Trigger: push a tag like `py-v0.3.0`. The tag must match sdk/pyproject.toml.
name: Publish Python SDK

on:
  push:
    tags: ["py-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('sdk/pyproject.toml','rb'))['project']['version'])")
          [ "py-v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build sdk
          twine check sdk/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write     # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
