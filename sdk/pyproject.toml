[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authyouragent"
version = "0.2.0"
description = "Auth Your Agent SDK: let AI agents act for a user on websites, with the user's approval on their phone."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.25", "pyjwt>=2.8", "cryptography>=41"]
keywords = ["ai-agents", "authorization", "dpop", "webauthn", "identity", "mcp", "takeover"]

# PyPI MCP registry: mcp-name must appear in README for registry verification
# mcp-name: com.authyouragent.mcp

[project.optional-dependencies]
takeover = ["websockets>=12"]
mcp = ["websockets>=12", "mcp>=1.2", "playwright>=1.40"]

[project.urls]
Homepage = "https://authyouragent.com"
Documentation = "https://authyouragent.com/docs"

[project.scripts]
authyouragent = "authyouragent.agent:_cli_main"
authyouragent-mcp = "authyouragent.mcp_server:main"

[tool.setuptools]
packages = ["authyouragent"]
